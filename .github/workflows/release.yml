name: Release

# Publishes a GitHub release that HACS offers as an update, named after
# "version" in manifest.json (tag v<version>). Start it either by pushing a
# matching tag (e.g. v0.1.0b2) or with "Run workflow" on main (Actions tab),
# which creates the tag on the current commit.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version from manifest.json
        id: version
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/ev_charge_planner/manifest.json'))['version'])")
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      - name: Check the tag or branch
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${TAG}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version (${TAG})" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "branch" ] && [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Run the release from main, not ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
